<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <!-- The window keeps the app name in the taskbar (main.js suppresses
         page-title-updated); this title is only what a devtools tab shows. -->
    <title>Pi Agent</title>
    <style>
      /* Windows Phone / Metro live tiles — same tokens as the splash and picker
         pages. Inlined because this file:// window loads before any app CSS
         exists. Square corners everywhere. */
      :root {
        --bg: #0a0a0a;
        --bg-panel: #141414;
        --text: #ffffff;
        --text-muted: #a6a6a6;
        --text-dim: #6a6a6a;
        --grid: rgba(255, 255, 255, 0.08);
        --accent: #0050ef;
        --teal: #00aba9;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Selawik, system-ui, -apple-system, BlinkMacSystemFont,
          "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        user-select: none;
      }
      body { display: flex; flex-direction: column; }

      header { padding: 26px 30px 16px; }
      h1 { margin: 0 0 6px; font-size: 24px; font-weight: 300; letter-spacing: 0.4px; }
      .sub { font-size: 12.5px; color: var(--text-muted); }

      main { flex: 1; display: flex; gap: 16px; padding: 6px 30px 0; }

      /* The two live tiles. Keyboard is first-class: 1 / 2 pick, Enter takes the
         focused tile, Esc quits — a launcher you must reach for the mouse to
         dismiss is a launcher that gets in the way. */
      .tile {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        background: var(--bg-panel);
        border: none;
        border-left: 4px solid var(--accent);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 90ms linear;
      }
      .tile.dsh { border-left-color: var(--teal); }
      .tile:hover, .tile:focus { background: #1c1c1c; outline: none; }
      .tile:focus { box-shadow: inset 0 0 0 2px var(--accent); }
      .tile.dsh:focus { box-shadow: inset 0 0 0 2px var(--teal); }
      .tile:active { transform: scale(0.985); }

      .key {
        display: inline-block;
        min-width: 20px;
        padding: 1px 6px;
        margin-bottom: 12px;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
        font-size: 11.5px;
        font-family: Consolas, ui-monospace, monospace;
      }
      .name { font-size: 20px; font-weight: 300; letter-spacing: 0.3px; }
      .desc { margin-top: 8px; font-size: 12.5px; color: var(--text-muted); line-height: 1.7; }
      .meta { margin-top: 14px; font-size: 11.5px; color: var(--text-dim); font-family: Consolas, ui-monospace, monospace; }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 30px 22px;
      }
      .remember { display: flex; align-items: center; gap: 9px; cursor: pointer; color: var(--text-muted); }
      /* Square Metro checkbox — a native control cannot be squared reliably. */
      .box { width: 17px; height: 17px; border: 2px solid var(--text-dim); position: relative; flex: 0 0 auto; }
      .remember.on .box { border-color: var(--accent); background: var(--accent); }
      .remember.on .box::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 0;
        width: 5px;
        height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(42deg);
      }
      .hint { font-size: 11.5px; color: var(--text-dim); }
    </style>
  </head>
  <body>
    <header>
      <h1>启动哪一个？</h1>
      <div class="sub">两个运行时相互独立，之后也能在 <code>App</code> 菜单里打开另一个。</div>
    </header>

    <main>
      <button class="tile pi" id="pi" autofocus>
        <div>
          <span class="key">1</span>
          <div class="name">Pi Agent</div>
          <div class="desc">pi-web + 内置扩展、技能、子代理面板。会话数据在 <code>~/.pi</code>。</div>
        </div>
        <div class="meta" id="pi-meta"></div>
      </button>

      <button class="tile dsh" id="dsh">
        <div>
          <span class="key">2</span>
          <div class="name">DeepSeek Harness</div>
          <div class="desc">打开 DeepSeek Harness 官方桌面端（独立应用，本程序随即退出）。会话与设置在 <code>~/.dsh</code>，与终端里的 <code>dsh</code> 共用。</div>
        </div>
        <div class="meta" id="dsh-meta"></div>
      </button>
    </main>

    <footer>
      <div class="remember" id="remember">
        <div class="box"></div>
        <span>记住选择，下次直接启动</span>
      </div>
      <div class="hint">1 / 2 选择 · Enter 确认 · Esc 退出</div>
    </footer>

    <script>
      let remember = false;
      const rememberEl = document.getElementById("remember");
      rememberEl.addEventListener("click", () => {
        remember = !remember;
        rememberEl.classList.toggle("on", remember);
      });

      let picked = false;
      const pick = (target) => {
        if (picked) return; // a double-click must not launch twice
        picked = true;
        window.piLauncher.choose(target, remember);
      };
      document.getElementById("pi").addEventListener("click", () => pick("pi"));
      document.getElementById("dsh").addEventListener("click", () => pick("dsh"));

      document.addEventListener("keydown", (e) => {
        if (e.key === "1") pick("pi");
        else if (e.key === "2") pick("dsh");
        else if (e.key === "Escape") window.piLauncher.cancel();
      });

      window.piLauncher.info().then((info) => {
        document.getElementById("pi-meta").textContent = info.piVersion ? `pi-web ${info.piVersion}` : "";
        // An absent version here means the application was not found at all —
        // say so, because the tile still works (it offers to locate it) and a
        // blank meta would read as "no version info" rather than "not installed".
        document.getElementById("dsh-meta").textContent = info.dshVersion ? `dsh ${info.dshVersion}` : "未安装";
      });
    </script>
  </body>
</html>

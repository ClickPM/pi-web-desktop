appId: com.agegr.piwebdesktop
# Keep this matching /^[-_+0-9a-zA-Z .]+$/. electron-builder only uses
# productName for the installation directory when it does; otherwise it falls
# back to the package name and NSIS nests the install one level deeper
# ("Pi&Dsh" briefly did exactly that: D:\Program Files\Pi&Dsh\pi-web-desktop).
# The name also reaches the exe filename and %APPDATA% verbatim.
productName: Pi
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

# Only the Electron shell goes into the asar. The bundled Node runtime and the
# pi-web runtime seed are shipped UNPACKED as extraResources (Node can't run
# from inside an asar; the seed is copied to a writable user dir on first run).
files:
  - electron/**/*
  - package.json
  # The icons main.js loads AT RUNTIME for its BrowserWindow.
  - build/icon.png
  - build/icon-pi.png

extraResources:
  # Bundled Node.js runtime (node.exe + npm) -> resources/node
  - from: vendor/node
    to: node
  # Bundled relocatable Python (python-build-standalone + ppt-master deps
  # pre-installed) -> resources/python. Provisioned by `npm run seed:python`.
  # Wired into the pi server env in main.js so the venv guard creates project
  # .venvs from it (zero system-Python dependency) and ppt-master runs on it
  # offline (zero runtime pip install). Strip caches/test noise to trim size.
  - from: vendor/python
    to: python
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/test/**"
      - "!**/tests/**"
  # pi-web runtime seed (npm prod install of @agegr/pi-web) -> resources/runtime-seed
  - from: runtime-seed
    to: runtime-seed
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/.cache/**"

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Development

appId: com.agegr.piwebdesktop
# Quoted because "&" is a YAML indicator character anywhere but mid-scalar, and
# because the name reaches NSIS, the exe name and %APPDATA% verbatim.
productName: "Pi&Dsh"
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

# Only the Electron shell goes into the asar. The bundled Node runtime and the
# pi-web runtime seed are shipped UNPACKED as extraResources (Node can't run
# from inside an asar; the seed is copied to a writable user dir on first run).
files:
  - electron/**/*
  - package.json
  # The two icons main.js loads AT RUNTIME for its BrowserWindows. They must be
  # inside the asar: main.js resolves them as `__dirname/../build/...`, which in a
  # packaged app is a path INSIDE app.asar, and Electron silently falls back to the
  # executable's icon when the file is missing — so before this line the per-window
  # icons worked in dev and quietly did nothing once installed. icon-dsh.png is not
  # listed: nothing in this shell loads it, it is an input to the DeepSeek Harness
  # build (see the icon table in the README).
  - build/icon.png
  - build/icon-pi.png

extraResources:
  # Bundled Node.js runtime (node.exe + npm) -> resources/node
  - from: vendor/node
    to: node
  # Bundled relocatable Python (python-build-standalone + ppt-master deps
  # pre-installed) -> resources/python. Provisioned by `npm run seed:python`.
  # Wired into the pi server env in main.js so the venv guard creates project
  # .venvs from it (zero system-Python dependency) and ppt-master runs on it
  # offline (zero runtime pip install). Strip caches/test noise to trim size.
  - from: vendor/python
    to: python
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/test/**"
      - "!**/tests/**"
  # pi-web runtime seed (npm prod install of @agegr/pi-web) -> resources/runtime-seed
  - from: runtime-seed
    to: runtime-seed
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/.cache/**"
  # DeepSeek Harness is NOT bundled. It used to ship here as a second npm
  # runtime seed (@deepseek-ai/dsh, ~270MB) that this shell started as
  # `dsh web`; upstream now ships its own Electron application, so the dsh
  # launch path is a hand-off to that instead (electron/features/dsh.js).
  #
  # To ship it inside this installer anyway, build upstream's win-x64 app and
  # uncomment the block below — features/dsh.js already looks in that slot,
  # ahead of a user-level or system-level install. It costs ~723MB unpacked
  # (Electron ~366 + its dsh seed ~249 + its bundled node/pnpm ~106), which is
  # why it is opt-in rather than the default.
  #
  # - from: ../deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/artifacts/win-unpacked
  #   to: dsh-app
  #   filter:
  #     - "**/*"

  # Bundled pi extensions (single-file .ts + manifest.json + shared deps) ->
  # resources/extensions-seed. manifest.json catalogues the set; the first-run
  # picker lets the user choose which ones get deployed into
  # ~/.pi/agent/extensions/ (see electron/features/extensions-manager.js).
  - from: extensions-seed
    to: extensions-seed
    filter:
      - "**/*"
      - "!**/*.map"
  # Default OKF knowledge skills (wiki-init/compile/query/lint + okf-visualizer).
  # Pure-stdlib Python; copied into ~/.pi/agent/skills/ on first run (see
  # ensureBundledSkills in main.js). __pycache__ / *.pyc are excluded from the bundle.
  - from: skills-seed
    to: skills-seed
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Development
